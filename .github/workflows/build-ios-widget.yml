name: Build iOS Widget

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  PROJECT_NAME: DeyeCloudWidget
  PROJECT_DIR: ${{ runner.temp }}/DeyeCloudWidget
  SCHEME: DeyeCloudWidget

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Create Xcode project
        shell: bash
        run: |
          # The generator currently writes to ~/Desktop and asks whether to open Xcode.
          # Answer no so the workflow remains non-interactive.
          printf 'n\n' | bash ./generate-xcode-project.sh "$PROJECT_NAME"
          if [ ! -d "$HOME/Desktop/$PROJECT_NAME/$PROJECT_NAME.xcodeproj" ]; then
            echo "Generated Xcode project was not found" >&2
            exit 1
          fi
          echo "PROJECT_DIR=$HOME/Desktop/$PROJECT_NAME" >> "$GITHUB_ENV"

      - name: Build for iOS device (Release)
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project "$PROJECT_DIR/$PROJECT_NAME.xcodeproj" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/$PROJECT_NAME.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Create IPA file
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH=$(find "$RUNNER_TEMP/$PROJECT_NAME.xcarchive/Products/Applications" -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP_PATH"
          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          (cd "$RUNNER_TEMP" && zip -qry "$GITHUB_WORKSPACE/$PROJECT_NAME.ipa" Payload)
          test -s "$GITHUB_WORKSPACE/$PROJECT_NAME.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeyeCloudWidget-ipa
          path: DeyeCloudWidget.ipa
          if-no-files-found: error

      - name: Create release with IPA
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-build-${{ github.run_number }}
          name: iOS build ${{ github.run_number }}
          generate_release_notes: true
          files: DeyeCloudWidget.ipa
