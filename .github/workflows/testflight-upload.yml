name: Upload iOS build to TestFlight

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT_NAME: DeyeCloudWidget
  SCHEME: DeyeCloudWidget
  TEAM_ID: ${{ secrets.TEAM_ID }}
  APP_BUNDLE_IDENTIFIER: ${{ secrets.APP_BUNDLE_IDENTIFIER }}
  WIDGET_BUNDLE_IDENTIFIER: ${{ secrets.WIDGET_BUNDLE_IDENTIFIER }}
  APP_STORE_CONNECT_USERNAME: ${{ secrets.APP_STORE_CONNECT_USERNAME }}
  APP_STORE_CONNECT_PASSWORD: ${{ secrets.APP_STORE_CONNECT_PASSWORD }}
  APPLE_ID: ${{ secrets.APPLE_ID }}

jobs:
  upload:
    name: Archive and upload to TestFlight
    runs-on: macos-latest
    environment: production
    steps:
      - name: Check out release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up signing keychain and profiles
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APP_PROFILE_BASE64: ${{ secrets.APP_PROVISIONING_PROFILE_BASE64 }}
          WIDGET_PROFILE_BASE64: ${{ secrets.WIDGET_PROVISIONING_PROFILE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          echo "$CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$APP_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/app.mobileprovision"
          echo "$WIDGET_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/widget.mobileprovision"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/app.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/"
          cp "$RUNNER_TEMP/widget.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/"

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail
          printf 'n\n' | bash ./generate-xcode-project.sh "$PROJECT_NAME"
          test -d "$HOME/Desktop/$PROJECT_NAME/$PROJECT_NAME.xcodeproj"
          echo "PROJECT_DIR=$HOME/Desktop/$PROJECT_NAME" >> "$GITHUB_ENV"

      - name: Install Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false
      - name: Install Fastlane gem
        run: gem install fastlane --no-document

      - name: Archive and export signed IPA
        env:
          APP_PROFILE_NAME: ${{ secrets.APP_PROVISIONING_PROFILE_NAME }}
          WIDGET_PROFILE_NAME: ${{ secrets.WIDGET_PROVISIONING_PROFILE_NAME }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fastlane"
          cat > "$RUNNER_TEMP/fastlane/Fastfile" <<'FASTFILE'
          default_platform(:ios)
          platform :ios do
            lane :beta do
              gym(
                project: ENV.fetch("PROJECT_DIR") + "/DeyeCloudWidget.xcodeproj",
                scheme: ENV.fetch("SCHEME"),
                configuration: "Release",
                clean: true,
                output_directory: ENV.fetch("RUNNER_TEMP"),
                output_name: "DeyeCloudWidget.ipa",
                export_method: "app-store",
                export_options: {
                  signingStyle: "manual",
                  teamID: ENV.fetch("TEAM_ID"),
                  provisioningProfiles: {
                    ENV.fetch("APP_BUNDLE_IDENTIFIER") => ENV.fetch("APP_PROFILE_NAME"),
                    ENV.fetch("WIDGET_BUNDLE_IDENTIFIER") => ENV.fetch("WIDGET_PROFILE_NAME")
                  }
                },
                xcargs: "DEVELOPMENT_TEAM=#{ENV.fetch('TEAM_ID')}"
              )
            end
          end
          FASTFILE
          cd "$RUNNER_TEMP/fastlane"
          fastlane beta --verbose

      - name: Upload to App Store Connect with Fastlane Pilot
        env:
          API_KEY_JSON: ${{ secrets.APP_STORE_CONNECT_API_KEY_JSON }}
          FASTLANE_USER: ${{ secrets.APP_STORE_CONNECT_USERNAME }}
          FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.APP_STORE_CONNECT_PASSWORD }}
          ITC_TEAM_ID: ${{ secrets.ITC_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${API_KEY_JSON:-}" ]; then
            printf '%s' "$API_KEY_JSON" > "$RUNNER_TEMP/app-store-connect-api-key.json"
            fastlane pilot upload --ipa "$RUNNER_TEMP/DeyeCloudWidget.ipa" --api_key_path "$RUNNER_TEMP/app-store-connect-api-key.json" --skip_waiting_for_build_processing true
          else
            test -n "${FASTLANE_USER:-}" && test -n "${FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD:-}"
            fastlane pilot upload --ipa "$RUNNER_TEMP/DeyeCloudWidget.ipa" --skip_waiting_for_build_processing true
          fi

      - name: Notify success
        if: success()
        run: echo "DeyeCloudWidget was uploaded to TestFlight successfully."

      - name: Notify failure
        if: failure()
        run: echo "TestFlight upload failed. Review the failing step and its redacted log output." >&2
